[project]
name = "hermes-meta-gateway"
version = "2.0.0"
description = "WhatsApp Human-in-the-Loop Gateway for Chilean Food Truck"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "httpx==0.28.1",
    "pydantic==2.7.0",
    "pydantic-settings==2.14.0",
    "openai>=1.0.0",
    "aiosqlite==0.22.1",
    "websockets==16.0",
    "structlog==24.1.0",
    "prometheus-client>=0.20.0",
]

[tool.setuptools]
packages = ["core", "db", "routers"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
hermes = "main:run"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # function calls in default args (FastAPI Depends pattern)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "db", "routers"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "dashboard/",
    "scratch/",
    ".venv/",
    "tests/",
    "scratchpad/",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
