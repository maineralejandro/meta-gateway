services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meta-gateway-backend
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@supabase_db_app:5432/postgres
    networks:
      - caddy_net
      - supabase_network_app
    labels:
      caddy: api.meta-gateway.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: meta-gateway-dashboard
    volumes:
      - ./dashboard:/app/dashboard
      - /app/dashboard/node_modules
    environment:
      NEXT_PUBLIC_DASHBOARD_TOKEN: ${NEXT_PUBLIC_DASHBOARD_TOKEN:-hermes_dashboard_2024}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.meta-gateway.localhost}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.meta-gateway.localhost/ws}
    networks:
      - caddy_net
    labels:
      caddy: meta-gateway.localhost
      caddy.reverse_proxy: "{{upstreams 3000}}"
    restart: unless-stopped

networks:
  caddy_net:
    external: true
  supabase_network_app:
    external: true
