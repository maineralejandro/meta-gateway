services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: meta-gateway-backend
    volumes:
      - .:/app
      - backend_venv:/app/.venv
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@supabase_db_app:5432/postgres
      SKIP_STARTUP_VALIDATION: "false"
    networks:
      - caddy_net
      - supabase_network_app
    labels:
      caddy: api.meta-gateway.localhost
      caddy.reverse_proxy: "{{upstreams 8080}}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dev
    container_name: meta-gateway-dashboard
    volumes:
      - ./dashboard:/app/dashboard
      - dashboard_node_modules:/app/dashboard/node_modules
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:-hermes_dashboard_2024}
      DASHBOARD_AUTH_SECRET: ${DASHBOARD_AUTH_SECRET:-hermes_auth_secret_change_in_production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.meta-gateway.localhost}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.meta-gateway.localhost/ws}
    networks:
      - caddy_net
    labels:
      caddy: meta-gateway.localhost
      caddy.reverse_proxy: "{{upstreams 3000}}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started

networks:
  caddy_net:
    external: true
  supabase_network_app:
    external: true

volumes:
  backend_venv:
  dashboard_node_modules:
